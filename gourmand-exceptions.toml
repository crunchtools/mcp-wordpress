# DC004: eight Pydantic input models (PostInput, PostUpdateInput,
# PageInput, PageUpdateInput, MediaInput, MediaUpdateInput, CommentInput,
# CommentUpdateInput) are fully defined and unit-tested in
# tests/test_validation.py, but NOT wired into the corresponding tool
# functions in tools/posts.py, tools/pages.py, tools/media.py, and
# tools/comments.py. create_post() (and the update/create paths for
# pages/media/comments), for example, take raw args and pass them straight
# to the WordPress API with no length limits, no status allowlist check,
# and no post_format validation -- exactly what models.py's own docstring
# claims is enforced ("All tool inputs are validated through these models
# to prevent injection attacks and ensure data integrity"). This is real,
# unfinished work, not a false positive or an architectural choice: the
# validation layer exists and is correct, but wiring it into ~10 tool
# functions changes runtime behavior (some previously-accepted inputs
# would now be rejected) and needs its own reviewed change, not a
# gourmand-migration PR. Classified fix_planned, not by_design -- counts
# against score until wired in. Flagged to the team lead separately.
[[exceptions]]
check = "dead_structs"
path = "src/mcp_wordpress_crunchtools/models.py"
justification = "Eight Pydantic input models are tested in tests/test_validation.py but never wired into their corresponding tool functions (posts/pages/media/comments create and update paths take raw unvalidated args); real, unfinished validation work, not a false positive"
classification = "fix_planned"

# Manifest lint suppression on pyproject.toml, audited with
# `ruff check --select <RULE>` and real hit counts recorded (see
# pyproject.toml comments):
#   TRY003 (4 files / 9 hits): descriptive one-off error messages,
#     confirmed genuinely spread, not masking anything -- reviewed.
#   TID252 (5 files / 11 hits): uniform `from .. import` idiom -- reviewed.
#   PLR2004 (client.py, 4 hits), PLW0603 (client.py + config.py, 2 hits),
#     PIE790 (errors.py, 3 hits), RUF022 (tools/__init__.py, 1 hit),
#     S101/S105/PLC0415/PLR2004 (tests/*): all narrow, single- or
#     two-file, reviewed and scoped to confirmed sites.
#   PLR0913/PLR0917 (6 files / 17 hits): NOT individually reviewed
#     function-by-function -- models.py defines tested-but-unwired Input
#     models (see the DC004/fix_planned exception above) for several of
#     these same functions, so this breadth may be masking incomplete
#     validation integration rather than a uniform "many args by design"
#     decision. Real debt until reviewed or the DC004 wiring lands.
# Classified accepted_bad_taste overall because PLR0913/PLR0917 remain
# real, unreviewed debt in this file -- not stamped by_design just because
# most of the other entries earned it.
[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = "PLR0913/PLR0917 remain global ignores not individually reviewed function-by-function (17 hits/6 files), and may be masking the same incomplete Input-model wiring flagged by the DC004 exception on models.py. All other entries were audited with `ruff check --select <RULE>` and scoped/confirmed; see pyproject.toml comments for real hit counts per rule"
classification = "accepted_bad_taste"
