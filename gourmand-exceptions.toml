# WordPress REST API endpoint paths mistaken for filesystem paths, or
# documentation/error-message prose describing the container upload-mount
# convention (the actual default is computed portably via
# tempfile.gettempdir() in __init__.py, not hardcoded).
[[exceptions]]
check = "absolute_paths"
path = "src/mcp_wordpress_crunchtools/__init__.py"
justification = "The tmp-directory reference is a docstring line describing MCP_UPLOAD_DIR's typical Linux default; the actual default is computed portably via tempfile.gettempdir(), not hardcoded"
classification = "gourmand_bug"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_wordpress_crunchtools/server.py"
justification = "the tmp-uploads path appears only in docstring/instructions prose describing the container upload-mount convention (matches the portably-computed default), not a hardcoded filesystem path in logic"
classification = "gourmand_bug"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_wordpress_crunchtools/tools/media.py"
justification = "the media endpoint path is a WordPress REST API path (client.get/patch/delete), not a filesystem path; the tmp-uploads path appears in an error message describing the container mount convention"
classification = "gourmand_bug"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_wordpress_crunchtools/tools/site.py"
justification = "the users-me endpoint path is a WordPress REST API path (client.get), not a filesystem path"
classification = "gourmand_bug"

# EV004: catches Exception from the optional Settings API call, logs at
# debug, and falls through to a fallback return with basic site info from
# config -- a genuine RECOVER, not a log-only handler.
[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_wordpress_crunchtools/tools/site.py"
justification = "Handler recovers by falling through to a fallback return with basic site info from config when the (admin-only) Settings API call fails; not log-only"
classification = "by_design"

# All four vars documented in README.md and CLAUDE.md, verified against
# source: WORDPRESS_URL/WORDPRESS_USERNAME/WORDPRESS_APP_PASSWORD are
# required (config.py raises ConfigurationError if missing);
# MCP_UPLOAD_DIR is optional, defaulting to tempfile.gettempdir() +
# "mcp-uploads" (documented as the tmp-uploads path for the common Linux
# container case, which matches). Not added to allowed_names, per upstream
# guidance: this exception is the reviewed confirmation that each is
# documented, not a silencing of the check.
[[exceptions]]
check = "hidden_env_config"
path = "src/mcp_wordpress_crunchtools/__init__.py"
justification = "MCP_UPLOAD_DIR is documented in README.md; its default (tempfile.gettempdir() + 'mcp-uploads') was verified against __init__.py's actual computation, not assumed from a docstring"
classification = "by_design"

[[exceptions]]
check = "hidden_env_config"
path = "src/mcp_wordpress_crunchtools/config.py"
justification = "WORDPRESS_URL, WORDPRESS_USERNAME, and WORDPRESS_APP_PASSWORD are documented in README.md and CLAUDE.md's Environment Variables sections; required status verified against config.py's source"
classification = "by_design"

[[exceptions]]
check = "hidden_env_config"
path = "src/mcp_wordpress_crunchtools/errors.py"
justification = "WORDPRESS_APP_PASSWORD is documented (see config.py exception above); referenced here only to redact it from error messages"
classification = "by_design"

[[exceptions]]
