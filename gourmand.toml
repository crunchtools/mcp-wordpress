# Gourmand Configuration
# AI slop detection for maintaining code quality
# See https://gitlab.com/mattdm/gourmand for documentation

[global]
excluded_paths = [
    ".git/**",
    ".venv/**",
    ".mypy_cache/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    ".github/**",
    "*.egg-info/**",
    "dist/**",
    "build/**",
    "uv.lock",
]

[checks]

[severity]

[output]
format = "text"
color = true
